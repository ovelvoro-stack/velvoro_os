<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velvoro OS – Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #222;
        }
        header {
            background: #0f172a;
            color: #ffffff;
            padding: 16px 24px;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        main {
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .actions a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            background: #2563eb;
            color: #ffffff;
        }
        .actions a.secondary {
            background: #475569;
        }
        footer {
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

<header>
    <h1>Velvoro OS – Dashboard</h1>
</header>

<main>
    <div class="card">
        <h2>Welcome</h2>
        <p>You have successfully logged in. This is your dashboard.</p>
    </div>

    <div class="card">
        <h2>Quick Actions</h2>
        <div class="actions">
            <a href="/product">Go to Product</a>
            <a href="/reports" class="secondary">View Reports</a>
            <a href="/login" class="secondary">Logout</a>
        </div>
    </div>
</main>

<footer>
    © Velvoro Software Solution
</footer>

</body>
</html>
