<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velvoro OS - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 80%;
            margin: 40px auto;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
        }
        .actions button {
            padding: 10px 16px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
            background: #2563eb;
        }
        .actions a button {
            text-decoration: none;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Welcome</h1>
        <p>You have successfully logged in. This is your dashboard.</p>
    </div>

    <div class="card">
        <h3>Quick Actions</h3>
        <div class="actions">
            <a href="/application">
                <button>Go to Application Form</button>
            </a>
            <a href="/logout">
                <button>Logout</button>
            </a>
        </div>
    </div>

    <div class="footer">
        © Velvoro Software Solution
    </div>
</div>

</body>
</html>
