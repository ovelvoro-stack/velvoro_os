<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velvoro OS - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 80%;
            margin: 40px auto;
        }
        .actions a {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 16px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        .logout {
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome</h2>
        <p>You have successfully logged in. This is your dashboard.</p>

        <div class="actions">
            <!-- ONLY VALID ROUTE -->
            <a href="/application">Go to Application Form</a>

            <!-- OPTIONAL -->
            <a href="/logout" class="logout">Logout</a>
        </div>
    </div>
</body>
</html>
